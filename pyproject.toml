[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-ai"
version = "0.1.0"
description = "Une architecture d'IA universelle modulaire et évolutive"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Votre Nom", email = "votre.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "transformers>=4.15.0",
    "datasets>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.12b0",
    "isort>=5.10.0",
    "mypy>=0.910",
    "flake8>=4.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

gpu = [
    "torch>=1.10.0+cu113",
    "torchvision>=0.11.0+cu113",
    "torchaudio>=0.10.0+cu113",
    "--extra-index-url https://download.pytorch.org/whl/cu113",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = find:

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.poetry.dependencies]
flash-attn = { version = "^2.3.3", extras = ["cu122"] }
hyena = "^0.1.6"
s3pool = "^0.4.2"
coremltools = "^7.0"
mobile-vit = { git = "https://github.com/apple/ml-mobilevit.git", rev = "main" }
